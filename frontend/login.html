<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - SuuSri Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">SuuSri Task Manager</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <div class="login-container">
    <div class="login-box">
      <h2>Login</h2>
      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required>

        <button type="submit">Login</button>
        <p id="loginStatus" style="margin-top:12px; font-weight:600;"></p>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusElem = document.getElementById('loginStatus');
      statusElem.textContent = 'Logging in...';
      statusElem.style.color = '#0284c7';

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('http://localhost:5000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          statusElem.textContent = 'Login successful! Redirecting...';
          statusElem.style.color = '#16a34a';
          localStorage.setItem('suusri_user', JSON.stringify(data.user));
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          statusElem.textContent = data.message || 'Login failed';
          statusElem.style.color = '#dc2626';
        }
      } catch (err) {
        statusElem.textContent = 'Backend offline. Proceeding in local mode...';
        statusElem.style.color = '#eab308';
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1200);
      }
    });
  </script>

</body>
</html>
